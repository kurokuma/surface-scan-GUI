[package]
name = "http-service-scan-gui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
anyhow = "1"
base64 = "0.22"
csv = "1"
chardetng = "0.1"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_extras = "0.31"
encoding_rs = "0.8"
futures = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "charset", "gzip", "brotli", "deflate"] }
rfd = "0.15"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
scraper = "0.23"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
webbrowser = "1"
x509-parser = { version = "0.17", features = ["verify"] }

[dev-dependencies]
rcgen = "0.13"

[profile.release]
lto = "thin"
strip = true
